            <circle cx="694" cy="372" r="40"/>
            <circle cx="874" cy="352" r="22"/>
        </g>

        <!-- faixa clara: cards de servico -->
        <rect x="212" y="580" width="716" height="58" fill="#EFF4FC"/>
        <g>
            <rect x="252" y="590" width="150" height="40" rx="8" fill="#FFFFFF"/>
            <circle cx="278" cy="610" r="11" fill="#DCE7FA"/>
            <rect x="298" y="605" width="82" height="7" rx="3.5" fill="#14183E" opacity="0.7"/>
            <rect x="298" y="618" width="60" height="6" rx="3" fill="#8A9AB5"/>

            <rect x="420" y="590" width="150" height="40" rx="8" fill="#1363C6"/>
            <circle cx="446" cy="610" r="11" fill="#FFFFFF" opacity="0.9"/>
            <rect x="466" y="605" width="82" height="7" rx="3.5" fill="#FFFFFF"/>
            <rect x="466" y="618" width="60" height="6" rx="3" fill="#FFFFFF" opacity="0.55"/>

            <rect x="588" y="590" width="150" height="40" rx="8" fill="#FFFFFF"/>
            <circle cx="614" cy="610" r="11" fill="#DCE7FA"/>
            <rect x="634" y="605" width="82" height="7" rx="3.5" fill="#14183E" opacity="0.7"/>
            <rect x="634" y="618" width="60" height="6" rx="3" fill="#8A9AB5"/>
        </g>
    </g>

    <!-- brilho sutil sobre a tela -->
    <path d="M212,212 L470,212 L212,428 Z" fill="#0B1F4D" opacity="0.025"/>

    <!-- base do notebook -->
    <path d="M120,654 H1020 L1046,706 H94 Z" fill="url(#base)"/>
    <rect x="94" y="700" width="952" height="16" rx="8" fill="#B9CDEC"/>
    <rect x="482" y="668" width="176" height="10" rx="5" fill="#AFC5E8"/>
    <!-- sombra sob a base -->
    <ellipse cx="570" cy="736" rx="470" ry="16" fill="#0B1F4D" opacity="0.18"/>

    <!-- ====== CELULAR ====== -->
    <g>
        <!-- sombra -->
        <rect x="756" y="486" width="264" height="468" rx="34" fill="#0B1F4D" opacity="0.28"/>
        <!-- corpo -->
        <rect x="750" y="474" width="264" height="468" rx="34" fill="#0E1730"/>
        <rect x="762" y="486" width="240" height="444" rx="26" fill="url(#phoneScr)"/>
        <!-- botoes laterais -->
