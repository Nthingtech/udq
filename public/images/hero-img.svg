            <rect x="654" y="251" width="52" height="8" rx="4"/>
            <rect x="718" y="251" width="60" height="8" rx="4"/>
            <rect x="790" y="251" width="46" height="8" rx="4"/>
            <rect x="848" y="251" width="52" height="8" rx="4"/>
