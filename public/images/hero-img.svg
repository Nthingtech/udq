<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1155 1000" width="1155" height="1000">
    <defs>
        <linearGradient id="scr" gradientUnits="userSpaceOnUse" x1="230" y1="230" x2="900" y2="640">
            <stop offset="0%" stop-color="#2A7BE4"/>
            <stop offset="100%" stop-color="#1258B4"/>
        </linearGradient>
        <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="180" y1="200" x2="980" y2="700">
            <stop offset="0%" stop-color="#F2F6FF"/>
            <stop offset="100%" stop-color="#C8D8F2"/>
        </linearGradient>
        <linearGradient id="base" gradientUnits="userSpaceOnUse" x1="120" y1="700" x2="1040" y2="740">
            <stop offset="0%" stop-color="#DCE7FA"/>
            <stop offset="50%" stop-color="#F4F8FF"/>
            <stop offset="100%" stop-color="#C2D4F0"/>
        </linearGradient>
        <linearGradient id="phoneScr" gradientUnits="userSpaceOnUse" x1="760" y1="470" x2="1020" y2="940">
            <stop offset="0%" stop-color="#1F72DE"/>
            <stop offset="100%" stop-color="#0F4FA8"/>
        </linearGradient>
        <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#01D1F5"/>
            <stop offset="100%" stop-color="#15ACE1"/>
        </linearGradient>
        <clipPath id="lapClip"><rect x="212" y="212" width="716" height="426" rx="6"/></clipPath>
        <clipPath id="phoneClip"><rect x="762" y="486" width="248" height="452" rx="26"/></clipPath>
    </defs>

    <!-- ====== elementos decorativos de fundo ====== -->
    <g opacity="0.16" fill="#FFFFFF">
        <circle cx="205" cy="150" r="12"/>
        <circle cx="150" cy="235" r="7"/>
        <circle cx="975" cy="185" r="9"/>
        <circle cx="1055" cy="300" r="14"/>
        <circle cx="120" cy="640" r="10"/>
    </g>
    <g opacity="0.12" fill="none" stroke="#FFFFFF" stroke-width="3">
        <circle cx="1010" cy="240" r="70"/>
        <circle cx="160" cy="560" r="48"/>
    </g>
    <!-- traco decorativo com a cor secundaria -->
    <g opacity="0.55" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M96,352 h58"/>
        <path d="M96,378 h34"/>
        <path d="M1024,690 h58"/>
        <path d="M1050,716 h32"/>
    </g>

    <!-- ====== NOTEBOOK ====== -->
    <!-- tampa -->
    <rect x="196" y="196" width="748" height="458" rx="18" fill="url(#metal)"/>
    <rect x="204" y="204" width="732" height="442" rx="13" fill="#0E1730"/>

    <!-- tela -->
