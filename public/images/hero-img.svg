        <!-- barra superior do site -->
        <rect x="212" y="212" width="716" height="86" fill="#1363C6"/>

        <!-- logo UDQ >_ na navbar -->
        <g transform="translate(248,228) scale(0.205)" fill="none" stroke="#FFFFFF"
