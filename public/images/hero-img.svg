                <rect x="952" y="532" width="26" height="4" rx="2"/>
                <rect x="952" y="541" width="26" height="4" rx="2"/>
                <rect x="952" y="550" width="26" height="4" rx="2"/>
            </g>

            <rect x="790" y="596" width="150" height="18" rx="6" fill="#FFFFFF"/>
            <rect x="790" y="624" width="112" height="18" rx="6" fill="#FFFFFF"/>
            <rect x="790" y="662" width="164" height="8" rx="4" fill="#FFFFFF" opacity="0.55"/>
            <rect x="790" y="678" width="132" height="8" rx="4" fill="#FFFFFF" opacity="0.55"/>

            <rect x="790" y="706" width="122" height="38" rx="19" fill="#FFFFFF"/>
            <rect x="818" y="720" width="66" height="10" rx="5" fill="#1363C6"/>

            <!-- faixa clara inferior -->
            <rect x="762" y="778" width="240" height="152" fill="#F4F7FE"/>
            <rect x="790" y="802" width="184" height="42" rx="8" fill="#FFFFFF"/>
            <circle cx="814" cy="823" r="12" fill="#DCE7FA"/>
            <rect x="836" y="818" width="94" height="7" rx="3.5" fill="#14183E" opacity="0.7"/>
            <rect x="790" y="858" width="184" height="42" rx="8" fill="#FFFFFF"/>
            <circle cx="814" cy="879" r="12" fill="#DCE7FA"/>
            <rect x="836" y="874" width="94" height="7" rx="3.5" fill="#14183E" opacity="0.7"/>
        </g>
    </g>
</svg>