# ============================================
# UDQ Software House
# config/application.properties
#
# Titulo, descricao e URL do site vem do FrontMatter
# de content/index.html, nao daqui.
# ============================================

site.default-locale=pt-BR

# Qute: expressoes usam {=...} em vez de {...}.
# Evita conflito com chaves literais em CSS inline,
# JSON-LD e atributos x-data do Alpine.
quarkus.qute.alt-expr-syntax=true

# Caminhos que o esbuild deve preservar em vez de resolver
# em tempo de build. O padrao e apenas 'static/*'; sem
# incluir '/images/*' aqui, os url() do _template.scss
# quebram a bundling com "Could not resolve".
# As imagens sao servidas por public/images/ em runtime.
quarkus.web-bundler.bundling.external=/static/*,/images/*

quarkus.web-bundler.browser-live-reload=true